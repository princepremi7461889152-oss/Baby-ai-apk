name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          JAVA_VERSION_OUT="$(java -version 2>&1 || true)"
          printf '%s\n' "$JAVA_VERSION_OUT"
          echo "JAVA_HOME=${JAVA_HOME:-}"

          JAVA_VERSION_LINE="$(printf '%s\n' "$JAVA_VERSION_OUT" | head -n 1)"
          if [ -z "$JAVA_VERSION_LINE" ]; then
            echo "::error::Java could not be detected."
            exit 1
          fi

          JAVA_MAJOR="$(printf '%s' "$JAVA_VERSION_LINE" | sed -nE 's/.*version "([0-9]+)(\.[0-9]+)?.*/\1/p')"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Unable to detect active Java major version from: $JAVA_VERSION_LINE"
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          packages: ""

      - name: Install Android SDK packages and accept licenses
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_BIN" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                SDKMANAGER_BIN="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || \
            "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-36.1" || true

          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
            echo "::warning::platforms;android-36.1 not present yet; listing available android-36 packages:"
            "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --channel=3 --list | grep -E "platforms;android-36|build-tools;36" || true
          fi
          ls -la "$SDK_ROOT/platforms" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f ./debug.keystore ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "::error::Temporary debug keystore ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore is present."

      - name: Build debug APK
        id: build_apk
        run: |
          BUILD_LOG="$(mktemp)"
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee "$BUILD_LOG"
          GRADLE_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo ""
            echo "================ EXACT FAILURE SUMMARY ================"
            awk '/^\* What went wrong:/,/^(\* Try:|BUILD FAILED)/' "$BUILD_LOG" || true
            echo "---------------- ROOT CAUSES ----------------"
            grep -E "^(FAILURE:|> |Caused by:|e: |ERROR:)" "$BUILD_LOG" | head -n 30 || true
            echo "======================================================="
            {
              echo "### Exact Gradle Failure Summary"
              echo '```text'
              awk '/^\* What went wrong:/,/^(\* Try:|BUILD FAILED)/' "$BUILD_LOG" || true
              echo "--- Root Causes ---"
              grep -E "^(FAILURE:|> |Caused by:|e: |ERROR:)" "$BUILD_LOG" | head -n 30 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$GRADLE_EXIT"
          fi

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::$APK_PATH does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "::error::Source APK is missing or empty: $SRC_APK"
            exit 1
          fi

          TMP_RELEASE_DIR="$(mktemp -d)"
          DEST_APK="${TMP_RELEASE_DIR}/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Prepared release APK is missing or empty: $DEST_APK"
            exit 1
          fi

          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset with filename $(basename "$DEST_APK")"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset does not exist."
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not end in .apk."
              exit 1
              ;;
          esac

          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp)"
          {
            echo "This is an automatically generated debug APK."
            echo ""
            echo "- Built by: GitHub Actions"
            echo "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}"
            echo "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Source commit SHA: ${GITHUB_SHA}"
            echo "- Purpose: Intended for testing only"
            echo "- Distribution notice: Not a Play Store production release"
            echo "- Signing notice: Signed only with a temporary debug keystore"
          } > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes-file "$NOTES_FILE"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")"
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_APK_URL"
            echo "Backup Actions Artifact: app-debug-apk remains available."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_APK_URL"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Page:** $RELEASE_URL"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed (outcome: ${RELEASE_OUTCOME})."
            if [ "$BUILD_OUTCOME" = "success" ]; then
              echo "APK build succeeded."
            else
              echo "APK build did not succeed (outcome: ${BUILD_OUTCOME})."
            fi

            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "The GitHub Actions artifact 'app-debug-apk' remains available."
            fi

            {
              echo "### GitHub Release Warning"
              echo ""
              echo "GitHub Release publishing did not succeed (outcome: \`${RELEASE_OUTCOME}\`). The direct latest-release link was not updated for this run."
              if [ "$BUILD_OUTCOME" = "success" ]; then
                echo "- **APK Build:** Succeeded"
              else
                echo "- **APK Build:** \`${BUILD_OUTCOME}\`"
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
